name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest, coverage gate 80%)
        run: pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e "./backend[dev]"

      - name: Build fixture lake
        run: python scripts/build_fixture_lake.py .lake

      - name: dbt build (models + tests)
        run: dbt build --project-dir pipelines/dbt --profiles-dir pipelines/dbt
        env:
          DBT_TARGET: ci
          DATALENS_LAKE_URI: ${{ github.workspace }}/.lake

  # frontend job lands in Week 3 with the Next.js scaffold (eslint + tsc + vitest)
