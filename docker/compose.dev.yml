name: datalens

x-airflow-common: &airflow-common
  image: datalens-airflow:dev
  build:
    context: .
    dockerfile: airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Australia/Sydney
    PYTHONPATH: /opt/datalens/src
    DATALENS_S3_ENDPOINT_URL: http://minio:9000
    DATALENS_S3_ACCESS_KEY_ID: minioadmin
    DATALENS_S3_SECRET_ACCESS_KEY: minioadmin
    DATALENS_S3_BUCKET: datalens
    DATALENS_LAKE_URI: s3://datalens
    DATALENS_ADZUNA_APP_ID: ${DATALENS_ADZUNA_APP_ID:-}
    DATALENS_ADZUNA_APP_KEY: ${DATALENS_ADZUNA_APP_KEY:-}
    # dbt: profile reads these; artifacts go to /tmp so the project mount stays read-only
    DBT_TARGET: dev
    DBT_S3_ENDPOINT: minio:9000
    DBT_TARGET_PATH: /tmp/dbt_target
    DBT_LOG_PATH: /tmp/dbt_logs
  volumes:
    - ../pipelines/dags:/opt/airflow/dags:ro
    - ../backend/src:/opt/datalens/src:ro
    - ../pipelines/dbt:/opt/datalens/dbt:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datalens
      POSTGRES_PASSWORD: datalens
      POSTGRES_DB: datalens
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalens"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/datalens

  backend:
    build:
      context: ../backend
    command: uvicorn datalens.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATALENS_S3_ENDPOINT_URL: http://minio:9000
      DATALENS_S3_ACCESS_KEY_ID: minioadmin
      DATALENS_S3_SECRET_ACCESS_KEY: minioadmin
      DATALENS_S3_BUCKET: datalens
      DATALENS_LAKE_URI: s3://datalens
      DATALENS_ADZUNA_APP_ID: ${DATALENS_ADZUNA_APP_ID:-}
      DATALENS_ADZUNA_APP_KEY: ${DATALENS_ADZUNA_APP_KEY:-}
    volumes:
      - ../backend/src:/app/src:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Data --lastname Lens --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
