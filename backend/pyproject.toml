[project]
name = "datalens-backend"
version = "0.1.0"
description = "DataLens backend — API, connectors, and pipeline logic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "boto3>=1.35",
    "tenacity>=9.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pandera>=0.24",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "boto3-stubs[s3]>=1.35",
    "dbt-duckdb>=1.9",
]

[project.scripts]
datalens-ingest = "datalens.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=datalens --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
show_missing = true
